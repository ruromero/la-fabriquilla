apiVersion: v1
kind: Secret
metadata:
  name: fabriquilla-creds
  namespace: fabriquilla
type: Opaque
# Create with:
#   kubectl -n fabriquilla create secret generic fabriquilla-creds \
#     --from-file=dispatcher.pem=/path/to/dispatcher.pem \
#     --from-file=worker.pem=/path/to/worker.pem \
#     --from-file=committer.pem=/path/to/committer.pem \
#     --from-literal=GEMINI_API_KEY=your-key \
#     --from-literal=DEEPSEEK_API_KEY=your-key
