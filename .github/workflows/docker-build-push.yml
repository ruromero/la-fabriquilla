name: Sandbox Images

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'deploy/sandbox-images/**'
      - '*.go'
      - 'go.mod'
  release:
    types: [published]

jobs:
  base:
    name: Build Base Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: quay.io/ruben/factory-base
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/sandbox-images/base/Dockerfile
          platforms: linux/amd64
          provenance: mode=min
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

  language:
    name: Build ${{ matrix.lang }} Image
    runs-on: ubuntu-latest
    needs: base
    strategy:
      matrix:
        include:
          - lang: go
            image: quay.io/ruben/factory-go
          - lang: rust
            image: quay.io/ruben/factory-rust
          - lang: typescript
            image: quay.io/ruben/factory-typescript
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Resolve base tag
        id: base_tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/sandbox-images/${{ matrix.lang }}/Dockerfile
          platforms: linux/amd64
          provenance: mode=min
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BASE_IMAGE=quay.io/ruben/factory-base:${{ steps.base_tag.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.lang }}
          cache-to: type=gha,mode=max,scope=${{ matrix.lang }}
